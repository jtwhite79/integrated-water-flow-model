name: Build IWFM

# Builds the IWFM executables (Simulation, PreProcessor, Budget, ZBudget) on
# Linux, macOS, and Windows with gfortran. heclib (HEC-DSS) and zlib are built
# from source and linked statically; HDF5 comes from the platform toolchain.
#
# NOTE: the CMake build lives on the `gfortran-build` branch (not `main`, which
# is a clean upstream mirror with no CMake), so CI runs there.

on:
  push:
    branches: [gfortran-build]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Linux + macOS: conda/micromamba toolchain (gfortran + system HDF5).
  # This mirrors the locally-verified macOS build exactly.
  # ---------------------------------------------------------------------------
  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash -el {0}   # login shell so the micromamba env is active
    steps:
      - uses: actions/checkout@v4

      - name: Set up build environment (micromamba)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" -DHDF5_ROOT="$CONDA_PREFIX" \
            -DIWFM_USE_SYSTEM_HDF5=ON \
            -DIWFM_USE_SYSTEM_ZLIB=OFF \
            -DIWFM_USE_SYSTEM_HECLIB=OFF \
            -DIWFM_BUILD_DLL=OFF \
            -DIWFM_BUILD_PARALLEL=OFF \
            -DIWFM_BUILD_COARRAY=OFF \
            -DIWFM_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build -j

      - name: Verify executables
        run: |
          ls -lh Bin/
          test -x Bin/Simulation && test -x Bin/PreProcessor \
            && test -x Bin/Budget && test -x Bin/ZBudget
          # heclib must be statically linked (not a dynamic dependency)
          if [ "${{ runner.os }}" = "macOS" ]; then
            ! otool -L Bin/Simulation | grep -qi heclib
          else
            ! ldd Bin/Simulation | grep -qi heclib
          fi

      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iwfm-${{ matrix.os }}
          path: Bin/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Windows: Intel oneAPI (ifx + icx) -- IWFM's native Windows toolchain.
  # gfortran/MinGW cannot be used: heclib (HEC-DSS) guards its Windows code on
  # _MSC_VER and uses POSIX calls (realpath) otherwise, so it needs an MSVC-ABI
  # C compiler (icx), which in turn requires an MSVC-ABI Fortran compiler (ifx).
  # HDF5/zlib/heclib are all built from source (no prebuilt ifx-compatible HDF5).
  # ---------------------------------------------------------------------------
  windows:
    name: windows-latest (Intel)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Intel oneAPI (ifx + icx)
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: intel

      - name: Install Ninja
        shell: cmd
        run: pip install ninja

      - name: Configure
        shell: cmd
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=icx
          -DCMAKE_Fortran_COMPILER=ifx
          -DIWFM_USE_SYSTEM_HDF5=OFF
          -DIWFM_USE_SYSTEM_ZLIB=OFF
          -DIWFM_USE_SYSTEM_HECLIB=OFF
          -DIWFM_BUILD_DLL=OFF
          -DIWFM_BUILD_PARALLEL=OFF
          -DIWFM_BUILD_COARRAY=OFF
          -DIWFM_BUILD_TESTS=OFF

      - name: Build
        shell: cmd
        run: cmake --build build -j

      - name: Verify executables
        shell: cmd
        run: dir Bin

      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iwfm-windows-latest
          path: Bin/
          if-no-files-found: warn
